function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function parseISO(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function fmtDate(iso, opts) {
  return parseISO(iso).toLocaleDateString("en-US", opts || { day: "2-digit", month: "short" });
}
function fmtDur(mins) {
  const s = Math.round(mins * 60);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  if (h > 0) return `${h}h ${String(m).padStart(2, "0")}m`;
  return `${m}m`;
}
function fmtClock(mins) {
  const s = Math.round(mins * 60);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
  return `${m}:${String(sec).padStart(2, "0")}`;
}
function chapKey(subj, ch) { return subj + "::" + ch; }

function genSyncCode() {
  const words = ["orbit", "cedar", "flux", "quartz", "ember", "delta", "coral", "lumen", "nova", "vapor", "birch", "prism"];
  const w = words[Math.floor(Math.random() * words.length)];
  const n = Math.floor(1000 + Math.random() * 9000);
  return `${w}-${n}`;
}

// ============================================================
// STORAGE: Firestore when configured, localStorage fallback otherwise
// ============================================================
function useProgressStore() {
  const [state, setState] = useState({ doneDays: {}, resources: {}, flags: {}, ready: false });
  const [syncMode, setSyncMode] = useState("checking"); // checking | firestore | local
  const [syncCode, setSyncCode] = useState(null);
  const [syncStatus, setSyncStatus] = useState("idle"); // idle | saving | saved | error
  const unsubRef = useRef(null);
  const skipNextSnapshot = useRef(false);

  const loadLocal = useCallback(() => {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { doneDays: {}, resources: {}, flags: {} };
  }, []);

  const saveLocal = useCallback((data) => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch (e) {}
  }, []);

  // init: decide firestore vs local
  useEffect(() => {
    function boot() {
      const configured = window.__firebaseConfigured && window.__firebaseReady;
      if (!configured) {
        const local = loadLocal();
        setState(s => ({ ...s, ...local, ready: true }));
        setSyncMode("local");
        return;
      }
      setSyncMode("firestore");
      let code = localStorage.getItem(LS_SYNC_CODE_KEY);
      if (!code) {
        code = genSyncCode();
        localStorage.setItem(LS_SYNC_CODE_KEY, code);
      }
      setSyncCode(code);
    }
    if (window.__firebaseReady || window.__firebaseError || window.__firebaseConfigured === false) {
      boot();
    } else {
      window.addEventListener("firebase-ready", boot, { once: true });
    }
  }, [loadLocal]);

  // subscribe to firestore doc once we have a sync code
  useEffect(() => {
    if (syncMode !== "firestore" || !syncCode) return;
    const { __db, __fsDoc, __fsOnSnapshot, __fsGetDoc } = window;
    const ref = __fsDoc(__db, "grind_progress", syncCode);

    __fsGetDoc(ref).then(snap => {
      if (snap.exists()) {
        const data = snap.data();
        setState(s => ({ ...s, doneDays: data.doneDays || {}, resources: data.resources || {}, flags: data.flags || {}, ready: true }));
      } else {
        setState(s => ({ ...s, ready: true }));
      }

      const unsub = __fsOnSnapshot(ref, (snap2) => {
        if (skipNextSnapshot.current) { skipNextSnapshot.current = false; return; }
        if (snap2.exists()) {
          const data = snap2.data();
          setState(s => ({ ...s, doneDays: data.doneDays || {}, resources: data.resources || {}, flags: data.flags || {}, ready: true }));
        }
      }, (err) => {
        console.error("Firestore listen error:", err);
        setSyncStatus("error");
      });
      unsubRef.current = unsub;
    }).catch(err => {
      console.error("Firestore get error:", err);
      setSyncStatus("error");
      const local = loadLocal();
      setState(s => ({ ...s, ...local, ready: true }));
    });

    return () => { if (unsubRef.current) unsubRef.current(); };
  }, [syncMode, syncCode, loadLocal]);

  const persist = useCallback((next) => {
    const { ready, ...payload } = next;
    if (syncMode === "firestore" && syncCode && window.__firebaseReady) {
      setSyncStatus("saving");
      skipNextSnapshot.current = true;
      const { __db, __fsDoc, __fsSetDoc } = window;
      const ref = __fsDoc(__db, "grind_progress", syncCode);
      __fsSetDoc(ref, payload).then(() => setSyncStatus("saved")).catch(err => {
        console.error("Firestore save error:", err);
        setSyncStatus("error");
      });
    } else {
      saveLocal(payload);
    }
  }, [syncMode, syncCode, saveLocal]);

  const markDone = useCallback((date, val) => {
    setState(s => {
      const next = { ...s, doneDays: { ...s.doneDays, [date]: val } };
      persist(next);
      return next;
    });
  }, [persist]);

  const toggleResource = useCallback((subject, chapter, resKey) => {
    setState(s => {
      const k = chapKey(subject, chapter);
      const cur = s.resources[k] || {};
      const next = { ...s, resources: { ...s.resources, [k]: { ...cur, [resKey]: !cur[resKey] } } };
      persist(next);
      return next;
    });
  }, [persist]);

  const toggleFlag = useCallback((subject, chapter) => {
    setState(s => {
      const k = chapKey(subject, chapter);
      const next = { ...s, flags: { ...s.flags, [k]: !s.flags[k] } };
      persist(next);
      return next;
    });
  }, [persist]);

  const switchSyncCode = useCallback((newCode) => {
    localStorage.setItem(LS_SYNC_CODE_KEY, newCode);
    setState(s => ({ ...s, ready: false }));
    setSyncCode(newCode);
  }, []);

  return { state, markDone, toggleResource, toggleFlag, syncMode, syncCode, syncStatus, switchSyncCode };
}

function GrindTracker() {
  const { state, markDone, toggleResource, toggleFlag, syncMode, syncCode, syncStatus, switchSyncCode } = useProgressStore();
  const [activeTab, setActiveTab] = useState("Physics");
  const [filter, setFilter] = useState("all");
  const [search, setSearch] = useState("");
  const [timerSec, setTimerSec] = useState(0);
  const [timerRunning, setTimerRunning] = useState(false);
  const [hoverCell, setHoverCell] = useState(null);
  const [showSyncPanel, setShowSyncPanel] = useState(false);
  const [codeInput, setCodeInput] = useState("");
  const timerRef = useRef(null);

  useEffect(() => {
    if (timerRunning) timerRef.current = setInterval(() => setTimerSec(s => s + 1), 1000);
    else clearInterval(timerRef.current);
    return () => clearInterval(timerRef.current);
  }, [timerRunning]);

  const studyDays = useMemo(() => PLAN.calendar.filter(e => e.type === "study"), []);
  const chapterSessions = useMemo(() => {
    const m = {};
    studyDays.forEach(e => {
      const k = chapKey(e.subject, e.chapter);
      if (!m[k]) m[k] = [];
      m[k].push(e);
    });
    return m;
  }, [studyDays]);

  const isChapterComplete = useCallback((subj, ch) => {
    const sessions = chapterSessions[chapKey(subj, ch)] || [];
    return sessions.length > 0 && sessions.every(s => state.doneDays[s.date]);
  }, [chapterSessions, state.doneDays]);

  const chapterProgress = useCallback((subj, ch) => {
    const sessions = chapterSessions[chapKey(subj, ch)] || [];
    if (sessions.length === 0) return 0;
    return sessions.filter(s => state.doneDays[s.date]).length / sessions.length;
  }, [chapterSessions, state.doneDays]);

  const chapterMinDone = useCallback((subj, ch) => {
    const sessions = chapterSessions[chapKey(subj, ch)] || [];
    return sessions.reduce((a, s) => a + (state.doneDays[s.date] ? s.duration : 0), 0);
  }, [chapterSessions, state.doneDays]);

  const subjectTotalMin = useCallback((subj) => PLAN.subjects[subj].reduce((a, c) => a + c.totalMin, 0), []);
  const subjectDoneMin = useCallback((subj) => PLAN.subjects[subj].reduce((a, c) => a + chapterMinDone(subj, c.name), 0), [chapterMinDone]);
  const subjectPct = useCallback((subj) => {
    const t = subjectTotalMin(subj);
    return t > 0 ? subjectDoneMin(subj) / t : 0;
  }, [subjectTotalMin, subjectDoneMin]);

  const isMissed = useCallback((e) => e.type === "study" && e.date < TODAY && !state.doneDays[e.date], [state.doneDays]);
  const missedDays = useMemo(() => studyDays.filter(isMissed), [studyDays, isMissed]);

  const focusEntry = useMemo(() => {
    if (missedDays.length > 0) return missedDays[0];
    const today = PLAN.calendar.find(e => e.date === TODAY);
    if (today && today.type === "study") return today;
    return studyDays.find(e => e.date >= TODAY) || studyDays[studyDays.length - 1];
  }, [missedDays, studyDays]);

  const streak = useMemo(() => {
    const relevant = studyDays.filter(e => e.date <= TODAY);
    let cur = 0;
    for (let i = relevant.length - 1; i >= 0; i--) { if (state.doneDays[relevant[i].date]) cur++; else break; }
    let longest = 0, run = 0;
    studyDays.forEach(e => {
      if (e.date > TODAY) return;
      if (state.doneDays[e.date]) { run++; longest = Math.max(longest, run); } else run = 0;
    });
    return { current: cur, longest };
  }, [studyDays, state.doneDays]);

  const momentum = useMemo(() => {
    const past = studyDays.filter(e => e.date <= TODAY);
    if (past.length === 0) return null;
    const onTime = past.filter(e => state.doneDays[e.date]).length / past.length;
    let resTotal = 0, resDone = 0;
    const seen = new Set();
    SUBJECTS.forEach(subj => PLAN.subjects[subj].forEach(c => {
      const k = chapKey(subj, c.name);
      if (seen.has(k)) return; seen.add(k);
      const r = state.resources[k] || {};
      RESOURCE_TYPES.forEach(rt => { resTotal++; if (r[rt.key]) resDone++; });
    }));
    const resPct = resTotal > 0 ? resDone / resTotal : 0;
    const streakPct = Math.min(streak.current / 14, 1);
    return Math.round((onTime * 0.5 + resPct * 0.3 + streakPct * 0.2) * 100);
  }, [studyDays, state.doneDays, state.resources, streak]);

  const expectedPct = useCallback((subj) => {
    const sessions = studyDays.filter(e => e.subject === subj);
    if (sessions.length === 0) return 0;
    return sessions.filter(e => e.date <= TODAY).length / sessions.length;
  }, [studyDays]);

  const projectFinish = useCallback((subj) => {
    const sessions = studyDays.filter(e => e.subject === subj);
    const total = sessions.length;
    const last = sessions[sessions.length - 1];
    const done = sessions.filter(e => state.doneDays[e.date]).length;
    if (done === 0) return { date: last.date, delta: 0, status: "exact" };
    const first = sessions[0];
    const anchor = TODAY > first.date ? TODAY : first.date;
    const elapsed = Math.max(1, (parseISO(anchor) - parseISO(first.date)) / 86400000 + 1);
    const rate = done / elapsed;
    const remaining = total - done;
    const daysNeeded = rate > 0 ? remaining / rate : remaining * 3;
    const projDate = new Date(parseISO(anchor).getTime() + daysNeeded * 86400000);
    const delta = Math.round((projDate - parseISO(last.date)) / 86400000);
    let status = "exact";
    if (delta < -1) status = "early"; else if (delta > 1) status = "late";
    return { date: projDate.toISOString().slice(0, 10), delta, status };
  }, [studyDays, state.doneDays]);

  const daysLeft = useMemo(() => {
    const end = parseISO(PLAN.endDate);
    const now = TODAY >= PLAN.startDate ? parseISO(TODAY) : parseISO(PLAN.startDate);
    return Math.max(0, Math.round((end - now) / 86400000));
  }, []);

  const overallPct = useMemo(() => {
    const t = SUBJECTS.reduce((a, s) => a + subjectTotalMin(s), 0);
    const d = SUBJECTS.reduce((a, s) => a + subjectDoneMin(s), 0);
    return t > 0 ? Math.round((d / t) * 100) : 0;
  }, [subjectTotalMin, subjectDoneMin]);

  const flaggedList = useMemo(() => {
    const list = [];
    SUBJECTS.forEach(subj => PLAN.subjects[subj].forEach(c => {
      if (state.flags[chapKey(subj, c.name)]) list.push({ subject: subj, chapter: c.name });
    }));
    return list;
  }, [state.flags]);

  if (syncMode === "checking" || !state.ready) {
    return (
      <div style={styles.root}>
        <div style={{ position: "relative", zIndex: 1, display: "flex", alignItems: "center", justifyContent: "center", height: 400, color: "rgba(255,255,255,0.5)", fontFamily: "Inter, sans-serif" }}>
          Loading your progress…
        </div>
      </div>
    );
  }

  const focusAccent = focusEntry ? ACCENT[SKEY[focusEntry.subject]] : ACCENT.phy;

  return (
    <div style={styles.root}>
      <div style={styles.mesh}>
        <div style={{ ...styles.blob, background: "#64d9ea", top: "-10%", left: "5%", animationDelay: "0s" }} />
        <div style={{ ...styles.blob, background: "#ffab6b", top: "10%", right: "0%", animationDelay: "-6s" }} />
        <div style={{ ...styles.blob, background: "#c4a8ff", bottom: "0%", left: "30%", animationDelay: "-12s" }} />
      </div>

      <style>{`
        @keyframes drift { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(4%,6%) scale(1.08); } 66% { transform: translate(-3%,-4%) scale(0.96); } }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .gt-scope * { box-sizing: border-box; }
        .gt-scope ::selection { background: #64d9ea; color: #06070a; }
        .gt-hm-cell { transition: transform 0.12s ease, box-shadow 0.12s ease; }
        .gt-hm-cell:hover { transform: scale(1.35); z-index: 5; }
        .gt-card { transition: border-color 0.15s ease, transform 0.15s ease; }
        .gt-card:hover { transform: translateY(-2px); }
        .gt-pip { transition: all 0.15s ease; }
        .gt-pip:hover { transform: translateY(-1px); }
        .gt-btn { transition: all 0.15s ease; }
        .gt-btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
        .gt-btn:active { transform: translateY(0); }
        .gt-chip { transition: all 0.15s ease; }
        .gt-tab { transition: all 0.2s ease; }
        .gt-fadeup { animation: fadeUp 0.4s ease; }
        .gt-scope input::placeholder { color: rgba(255,255,255,0.3); }
        .gt-scope input:focus { outline: none; border-color: rgba(255,255,255,0.35) !important; }
        .gt-scope button:focus-visible { outline: 2px solid #64d9ea; outline-offset: 2px; }
        @media (max-width: 860px) { .gt-dual { grid-template-columns: 1fr !important; } }
        @media (max-width: 600px) {
          .gt-topbar { flex-direction: column; align-items: flex-start !important; }
          .gt-stats { grid-template-columns: repeat(2, 1fr) !important; }
          .gt-hero-actions { flex-direction: column; }
          .gt-hero-actions button { width: 100%; }
          .gt-heatmap { grid-template-columns: repeat(10, 1fr) !important; }
        }
      `}</style>

      <div className="gt-scope" style={{ position: "relative", zIndex: 1, maxWidth: 1180, margin: "0 auto", padding: "24px 20px 60px", fontFamily: "'Inter', sans-serif", color: "#f2f3f6" }}>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12, marginBottom: 20 }} className="gt-topbar">
          <div style={{ display: "flex", alignItems: "baseline", gap: 10 }}>
            <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 20, letterSpacing: "-0.01em" }}>GRIND<span style={{ color: "#64d9ea" }}>.</span></div>
            <div style={{ fontSize: 11, color: "rgba(255,255,255,0.4)", fontFamily: "'JetBrains Mono', monospace", textTransform: "uppercase", letterSpacing: "0.08em" }}>Board Prep Console</div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <button
              onClick={() => setShowSyncPanel(v => !v)}
              className="gt-btn"
              style={{ display: "flex", alignItems: "center", gap: 7, borderRadius: 100, padding: "8px 14px", border: "1px solid rgba(255,255,255,0.14)", background: "rgba(255,255,255,0.05)", cursor: "pointer", fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: "rgba(255,255,255,0.6)" }}
            >
              <div style={{ width: 6, height: 6, borderRadius: "50%", background: syncMode === "firestore" ? (syncStatus === "error" ? "#ff6b6b" : "#6fe3a1") : "#ffab6b", boxShadow: syncMode === "firestore" && syncStatus !== "error" ? "0 0 8px #6fe3a1" : "none" }} />
              {syncMode === "firestore" ? (syncStatus === "saving" ? "Syncing…" : "Cloud synced") : "Local only"}
            </button>
            <GlassPanel style={{ borderRadius: 100, padding: "8px 16px", display: "flex", alignItems: "center", gap: 8 }}>
              <div style={{ width: 6, height: 6, borderRadius: "50%", background: "#6fe3a1", boxShadow: "0 0 8px #6fe3a1", animation: "pulse 2s ease-in-out infinite" }} />
              <span style={{ fontSize: 12, fontFamily: "'JetBrains Mono', monospace", color: "rgba(255,255,255,0.55)" }}>
                {fmtDate(TODAY >= PLAN.startDate ? TODAY : PLAN.startDate, { day: "2-digit", month: "short" })}
                <b style={{ color: "#fff", marginLeft: 6 }}>· {daysLeft}d to deadline</b>
              </span>
            </GlassPanel>
          </div>
        </div>

        {showSyncPanel && (
          <GlassPanel style={{ padding: 20, marginBottom: 16 }} accentGlow={syncMode === "firestore" ? "rgba(111,227,161,0.3)" : "rgba(255,171,107,0.3)"}>
            {syncMode === "firestore" ? (
              <>
                <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 14, marginBottom: 8 }}>Cloud sync active</div>
                <div style={{ fontSize: 12.5, color: "rgba(255,255,255,0.55)", marginBottom: 12, lineHeight: 1.6 }}>This device's sync code — enter it on another device (with this same file + Firebase config) to share progress:</div>
                <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                  <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 15, fontWeight: 700, background: "rgba(0,0,0,0.3)", padding: "8px 14px", borderRadius: 10, border: "1px solid rgba(255,255,255,0.1)" }}>{syncCode}</div>
                  <button onClick={() => navigator.clipboard.writeText(syncCode || "")} className="gt-btn" style={{ fontSize: 12, fontWeight: 600, padding: "9px 14px", borderRadius: 10, border: "1px solid rgba(255,255,255,0.15)", background: "rgba(255,255,255,0.06)", color: "#fff", cursor: "pointer" }}>Copy</button>
                </div>
                <div style={{ marginTop: 16, paddingTop: 16, borderTop: "1px solid rgba(255,255,255,0.08)" }}>
                  <div style={{ fontSize: 12.5, color: "rgba(255,255,255,0.55)", marginBottom: 8 }}>Have a code from another device? Enter it to switch:</div>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                    <input value={codeInput} onChange={e => setCodeInput(e.target.value)} placeholder="e.g. cedar-4821" style={{ flex: 1, minWidth: 140, background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.12)", borderRadius: 10, padding: "8px 14px", color: "#fff", fontSize: 13, fontFamily: "'JetBrains Mono', monospace" }} />
                    <button onClick={() => { if (codeInput.trim()) { switchSyncCode(codeInput.trim()); setCodeInput(""); setShowSyncPanel(false); } }} className="gt-btn" style={{ fontSize: 12, fontWeight: 700, padding: "9px 16px", borderRadius: 10, border: "none", background: "#64d9ea", color: "#06070a", cursor: "pointer" }}>Switch</button>
                  </div>
                </div>
              </>
            ) : (
              <>
                <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 14, marginBottom: 8, color: "#ffab6b" }}>Running in local-only mode</div>
                <div style={{ fontSize: 12.5, color: "rgba(255,255,255,0.55)", lineHeight: 1.6, marginBottom: 12 }}>
                  Progress is saved to this browser only and won't sync to other devices.
                </div>
                <button
                  onClick={() => { try { localStorage.removeItem("grind_tracker_setup_dismissed"); } catch (e) {} window.location.reload(); }}
                  className="gt-btn"
                  style={{ fontSize: 12, fontWeight: 700, padding: "9px 16px", borderRadius: 10, border: "none", background: "#ffab6b", color: "#2b1608", cursor: "pointer" }}
                >
                  Show cloud sync setup guide
                </button>
              </>
            )}
          </GlassPanel>
        )}

        {missedDays.length > 0 && (
          <GlassPanel accentGlow="rgba(255,107,107,0.3)" style={{ padding: "14px 20px", marginBottom: 16, display: "flex", alignItems: "center", gap: 14, border: "1px solid rgba(255,107,107,0.35)", background: "linear-gradient(155deg, rgba(255,107,107,0.14), rgba(255,107,107,0.04))" }} className="gt-fadeup">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff8a8a" strokeWidth="2" style={{ flexShrink: 0 }}><path d="M12 9v4M12 17h.01M10.3 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L14.7 3.86a2 2 0 00-3.4 0z" /></svg>
            <div style={{ flex: 1, fontSize: 13 }}>
              <b style={{ color: "#ff9d9d" }}>{missedDays.length} pending day{missedDays.length > 1 ? "s" : ""}</b> — not marked complete
              <div style={{ fontSize: 11, color: "rgba(255,255,255,0.45)", marginTop: 2, fontFamily: "'JetBrains Mono', monospace" }}>
                {(() => {
                  const nf = PLAN.calendar.find(e => e.date >= TODAY && (e.type === "rest" || e.type === "buffer"));
                  return nf ? `Suggested catch-up → ${fmtDate(nf.date)} (${nf.type})` : null;
                })()}
              </div>
            </div>
          </GlassPanel>
        )}

        <GlassPanel accentGlow={focusAccent.glow} style={{ padding: 26, marginBottom: 16 }}>
          {focusEntry && focusEntry.type === "study" ? (() => {
            const done = !!state.doneDays[focusEntry.date];
            const future = focusEntry.date > TODAY;
            const planNotStarted = TODAY < PLAN.startDate;
            const label = planNotStarted ? "PLAN STARTS" : (focusEntry.date < TODAY ? "PENDING · CATCH UP" : (focusEntry.date === TODAY ? "TODAY'S SESSION" : "UPCOMING SESSION"));
            const Icon = SUBJ_ICON[focusEntry.subject];
            return (
              <>
                <div style={{ fontSize: 10.5, fontFamily: "'JetBrains Mono', monospace", letterSpacing: "0.1em", textTransform: "uppercase", color: "rgba(255,255,255,0.4)", marginBottom: 10 }}>
                  {label} · {fmtDate(focusEntry.date, { weekday: "short", day: "2-digit", month: "short" })}
                </div>
                <div style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: 11, fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, padding: "4px 12px", borderRadius: 100, marginBottom: 12, textTransform: "uppercase", letterSpacing: "0.04em", background: focusAccent.soft, color: focusAccent.c, border: `1px solid ${focusAccent.glow}` }}>
                  <Icon width={13} height={13} /> {focusEntry.subject}
                </div>
                <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 26, fontWeight: 600, letterSpacing: "-0.01em", marginBottom: 4 }}>{focusEntry.chapter}</div>
                <div style={{ fontSize: 12.5, color: "rgba(255,255,255,0.45)", fontFamily: "'JetBrains Mono', monospace" }}>
                  {focusEntry.totalParts > 1 ? `Part ${focusEntry.part} of ${focusEntry.totalParts}` : "Full lecture"} · {fmtDur(focusEntry.duration)}
                </div>

                {focusEntry.totalParts > 1 && (
                  <div style={{ marginTop: 18, display: "flex", alignItems: "center", gap: 14, fontFamily: "'JetBrains Mono', monospace" }}>
                    <div style={{ background: "rgba(0,0,0,0.25)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 12, padding: "10px 16px", textAlign: "center" }}>
                      <div style={{ fontSize: 9, color: "rgba(255,255,255,0.4)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 3 }}>Start</div>
                      <div style={{ fontSize: 18, fontWeight: 700 }}>{fmtClock(focusEntry.startMin)}</div>
                    </div>
                    <div style={{ color: "rgba(255,255,255,0.3)", fontSize: 16 }}>→</div>
                    <div style={{ background: "rgba(0,0,0,0.25)", border: "1px solid rgba(255,255,255,0.1)", borderRadius: 12, padding: "10px 16px", textAlign: "center" }}>
                      <div style={{ fontSize: 9, color: "rgba(255,255,255,0.4)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 3 }}>Stop</div>
                      <div style={{ fontSize: 18, fontWeight: 700 }}>{fmtClock(focusEntry.endMin)}</div>
                    </div>
                    <div style={{ marginLeft: "auto", fontSize: 11.5, color: "rgba(255,255,255,0.4)" }}>{fmtDur(focusEntry.duration)} today</div>
                  </div>
                )}

                {!future && !done && (
                  <div style={{ marginTop: 16, display: "flex", alignItems: "center", gap: 12 }}>
                    <button className="gt-btn" onClick={() => setTimerRunning(r => !r)} style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5, fontWeight: 600, padding: "10px 16px", borderRadius: 12, border: "1px solid rgba(255,255,255,0.15)", background: "rgba(255,255,255,0.06)", color: "#fff", cursor: "pointer" }}>
                      {timerRunning ? "⏸ Pause" : "▶ Start focus timer"}
                    </button>
                    <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 20, fontWeight: 700, color: timerRunning ? focusAccent.c : "#fff", minWidth: 70 }}>
                      {String(Math.floor(timerSec / 60)).padStart(2, "0")}:{String(timerSec % 60).padStart(2, "0")}
                    </div>
                  </div>
                )}

                {done ? (
                  <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "14px 18px", background: "rgba(111,227,161,0.12)", border: "1px solid rgba(111,227,161,0.4)", borderRadius: 14, marginTop: 16, fontSize: 13, color: "#8ef0b6", fontWeight: 600 }}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12" /></svg>
                    Session marked complete
                  </div>
                ) : (
                  <div style={{ display: "flex", gap: 10, marginTop: 18, flexWrap: "wrap" }} className="gt-hero-actions">
                    <button className="gt-btn" onClick={() => { markDone(focusEntry.date, true); setTimerRunning(false); setTimerSec(0); }} style={{ fontSize: 13, fontWeight: 700, padding: "11px 20px", borderRadius: 12, border: "none", background: `linear-gradient(135deg, ${focusAccent.c}, ${focusAccent.c}dd)`, color: "#06070a", cursor: "pointer" }}>
                      Mark complete
                    </button>
                    <button className="gt-btn" onClick={() => { setActiveTab(focusEntry.subject); document.getElementById("gt-wall")?.scrollIntoView({ behavior: "smooth", block: "start" }); }} style={{ fontSize: 13, fontWeight: 600, padding: "11px 20px", borderRadius: 12, border: "1px solid rgba(255,255,255,0.15)", background: "transparent", color: "#fff", cursor: "pointer" }}>
                      View in wall
                    </button>
                  </div>
                )}
              </>
            );
          })() : (
            <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 20, fontWeight: 600 }}>All caught up 🎉</div>
          )}
        </GlassPanel>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 10, marginBottom: 16 }} className="gt-stats">
          {[
            { lbl: "Streak", val: streak.current, unit: "d", sub: `best: ${streak.longest}d` },
            { lbl: "Momentum", val: momentum === null ? "—" : momentum, unit: momentum === null ? "" : "/100", sub: momentum === null ? "starts day 1" : "on-time + res + streak", warn: momentum !== null && momentum < 50, ok: momentum !== null && momentum >= 80 },
            { lbl: "Pending", val: missedDays.length, unit: "d", sub: missedDays.length === 0 ? "clean run" : "needs catch-up", warn: missedDays.length > 0 },
            { lbl: "Overall", val: overallPct, unit: "%", sub: `${fmtDur(SUBJECTS.reduce((a, s) => a + subjectDoneMin(s), 0))} logged` },
            { lbl: "Days left", val: daysLeft, unit: "d", sub: "till 31 Dec" },
          ].map((s, i) => (
            <GlassPanel key={i} style={{ padding: "16px 18px", borderRadius: 18 }}>
              <div style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: "0.08em", color: "rgba(255,255,255,0.4)", fontFamily: "'JetBrains Mono', monospace", marginBottom: 8 }}>{s.lbl}</div>
              <div style={{ fontSize: 26, fontWeight: 700, fontFamily: "'JetBrains Mono', monospace", letterSpacing: "-0.02em", color: s.warn ? "#ff8a8a" : (s.ok ? "#8ef0b6" : "#fff") }}>
                {s.val}<span style={{ fontSize: 14, color: "rgba(255,255,255,0.4)", fontWeight: 500 }}>{s.unit}</span>
              </div>
              <div style={{ fontSize: 10.5, color: "rgba(255,255,255,0.4)", marginTop: 3 }}>{s.sub}</div>
            </GlassPanel>
          ))}
        </div>

        <GlassPanel style={{ padding: 22, marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 8 }}>
            <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 600 }}>Grind Wall <span style={{ color: "rgba(255,255,255,0.35)", fontFamily: "'JetBrains Mono', monospace", fontWeight: 400, fontSize: 12 }}>· {PLAN.calendar.length} days</span></div>
            <div style={{ display: "flex", gap: 12, fontSize: 10.5, color: "rgba(255,255,255,0.45)", fontFamily: "'JetBrains Mono', monospace", flexWrap: "wrap" }}>
              {[["Physics", ACCENT.phy.c], ["Chemistry", ACCENT.chem.c], ["Maths", ACCENT.math.c], ["Missed", "#ff6b6b"]].map(([l, c]) => (
                <span key={l} style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 8, height: 8, borderRadius: 2, background: c }} />{l}</span>
              ))}
            </div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(20, 1fr)", gap: 4, position: "relative" }} className="gt-heatmap">
            {PLAN.calendar.map(entry => {
              let bg = "rgba(255,255,255,0.05)", border = "1px solid transparent", extra = {};
              const tip = fmtDate(entry.date, { weekday: "short", day: "2-digit", month: "short" });
              let tipDetail = "";
              if (entry.type === "rest") { tipDetail = "Rest day"; }
              else if (entry.type === "buffer") { bg = "rgba(255,255,255,0.03)"; border = "1px dashed rgba(255,255,255,0.15)"; tipDetail = "Buffer day"; }
              else if (entry.type === "study") {
                const sk = SKEY[entry.subject];
                const a = ACCENT[sk];
                const done = state.doneDays[entry.date];
                const missed = isMissed(entry);
                const future = entry.date > TODAY;
                if (missed) { bg = "#ff6b6b"; extra.boxShadow = "0 0 10px rgba(255,107,107,0.5)"; tipDetail = `MISSED — ${entry.subject}: ${entry.chapter}`; }
                else if (done) { bg = a.c; extra.boxShadow = `0 0 8px ${a.glow}`; tipDetail = `✓ ${entry.subject}: ${entry.chapter}`; }
                else { bg = a.soft; border = `1px solid ${a.glow}`; if (future) extra.opacity = 0.5; tipDetail = `${entry.subject}: ${entry.chapter}`; }
              }
              const isToday = entry.date === TODAY;
              return (
                <div key={entry.date} className="gt-hm-cell" onMouseEnter={() => setHoverCell({ date: entry.date, text: `${tip} · ${tipDetail}` })} onMouseLeave={() => setHoverCell(null)}
                  style={{ aspectRatio: "1", borderRadius: 5, background: bg, border, cursor: "pointer", boxShadow: isToday ? "0 0 0 2px #fff inset" : (extra.boxShadow || "none"), opacity: extra.opacity || 1 }} />
              );
            })}
            {hoverCell && (
              <div style={{ position: "fixed", pointerEvents: "none", zIndex: 50, background: "rgba(10,10,14,0.95)", backdropFilter: "blur(12px)", border: "1px solid rgba(255,255,255,0.15)", borderRadius: 8, padding: "6px 10px", fontSize: 11, fontFamily: "'JetBrains Mono', monospace", whiteSpace: "nowrap", top: 10, left: 10 }}>
                {hoverCell.text}
              </div>
            )}
          </div>
        </GlassPanel>

        <div style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 16, marginBottom: 16 }} className="gt-dual">
          <GlassPanel style={{ padding: 22 }}>
            <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 600, marginBottom: 16 }}>Subject Race</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              {SUBJECTS.map(subj => {
                const pct = subjectPct(subj), exp = expectedPct(subj);
                const a = ACCENT[SKEY[subj]];
                const diff = pct - exp;
                const Icon = SUBJ_ICON[subj];
                let statusText = "on pace", statusColor = "rgba(255,255,255,0.35)";
                if (diff > 0.03) { statusText = "ahead of pace"; statusColor = "#8ef0b6"; }
                else if (diff < -0.03) { statusText = "behind pace"; statusColor = "#ff9d9d"; }
                return (
                  <div key={subj} style={{ display: "grid", gridTemplateColumns: "100px 1fr 110px", alignItems: "center", gap: 14 }}>
                    <div style={{ fontSize: 12.5, fontWeight: 700, fontFamily: "'JetBrains Mono', monospace", display: "flex", alignItems: "center", gap: 7, color: a.c }}>
                      <Icon width={12} height={12} /> {subj}
                    </div>
                    <div style={{ height: 10, background: "rgba(0,0,0,0.25)", borderRadius: 6, position: "relative", overflow: "hidden", border: "1px solid rgba(255,255,255,0.06)" }}>
                      <div style={{ height: "100%", width: `${(pct * 100).toFixed(1)}%`, borderRadius: 6, background: `linear-gradient(90deg, ${a.c}99, ${a.c})`, transition: "width 0.6s cubic-bezier(.16,1,.3,1)", boxShadow: `0 0 10px ${a.glow}` }} />
                      <div style={{ position: "absolute", top: -3, left: `${(exp * 100).toFixed(1)}%`, width: 3, height: 16, background: "#fff", borderRadius: 2, boxShadow: "0 0 4px rgba(0,0,0,0.5)" }} />
                    </div>
                    <div style={{ textAlign: "right", fontFamily: "'JetBrains Mono', monospace" }}>
                      <b style={{ fontSize: 14 }}>{Math.round(pct * 100)}%</b>
                      <div style={{ fontSize: 9.5, textTransform: "uppercase", letterSpacing: "0.04em", color: statusColor, marginTop: 2 }}>{statusText}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </GlassPanel>

          <GlassPanel style={{ padding: 22 }}>
            <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 600, marginBottom: 16 }}>Time Machine <span style={{ fontSize: 11, color: "rgba(255,255,255,0.35)", fontFamily: "'JetBrains Mono', monospace", fontWeight: 400 }}>· projected finish</span></div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 10 }}>
              {SUBJECTS.map(subj => {
                const proj = projectFinish(subj);
                const a = ACCENT[SKEY[subj]];
                const Icon = SUBJ_ICON[subj];
                const dTxt = proj.status === "exact" ? "on schedule" : proj.status === "early" ? `${Math.abs(proj.delta)}d early` : `${proj.delta}d late`;
                const dColor = proj.status === "exact" ? "rgba(255,255,255,0.4)" : proj.status === "early" ? "#8ef0b6" : "#ff9d9d";
                return (
                  <div key={subj} style={{ background: "rgba(0,0,0,0.2)", border: "1px solid rgba(255,255,255,0.08)", borderRadius: 14, padding: "12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <div style={{ fontSize: 12, fontWeight: 700, fontFamily: "'JetBrains Mono', monospace", color: a.c, display: "flex", alignItems: "center", gap: 6 }}><Icon width={12} height={12} />{subj}</div>
                    <div style={{ textAlign: "right" }}>
                      <div style={{ fontSize: 15, fontWeight: 700 }}>{fmtDate(proj.date, { day: "2-digit", month: "short" })}</div>
                      <div style={{ fontSize: 10.5, fontFamily: "'JetBrains Mono', monospace", color: dColor }}>{dTxt}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </GlassPanel>
        </div>

        <GlassPanel id="gt-wall" style={{ padding: 22, marginBottom: 16 }}>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 600, marginBottom: 16 }}>Progress Wall</div>

          <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
            {SUBJECTS.map(subj => {
              const pct = Math.round(subjectPct(subj) * 100);
              const a = ACCENT[SKEY[subj]];
              const doneCh = PLAN.subjects[subj].filter(c => isChapterComplete(subj, c.name)).length;
              const Icon = SUBJ_ICON[subj];
              const active = activeTab === subj;
              return (
                <button key={subj} className="gt-tab" onClick={() => setActiveTab(subj)}
                  style={{ flex: "1 1 160px", textAlign: "left", padding: 14, borderRadius: 16, cursor: "pointer",
                    border: active ? `1px solid ${a.glow}` : "1px solid rgba(255,255,255,0.1)",
                    background: active ? `linear-gradient(155deg, ${a.soft}, rgba(255,255,255,0.02))` : "rgba(255,255,255,0.03)",
                    boxShadow: active ? `0 0 24px -8px ${a.glow}` : "none" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                    <div style={{ fontSize: 13, fontWeight: 700, fontFamily: "'JetBrains Mono', monospace", color: a.c, display: "flex", alignItems: "center", gap: 6 }}><Icon width={13} height={13} />{subj}</div>
                    <div style={{ fontSize: 12, fontFamily: "'JetBrains Mono', monospace", color: "rgba(255,255,255,0.5)" }}>{pct}%</div>
                  </div>
                  <div style={{ height: 5, background: "rgba(0,0,0,0.3)", borderRadius: 3, overflow: "hidden" }}>
                    <div style={{ height: "100%", width: `${pct}%`, borderRadius: 3, background: a.c, transition: "width 0.5s" }} />
                  </div>
                  <div style={{ fontSize: 10, color: "rgba(255,255,255,0.35)", marginTop: 7, fontFamily: "'JetBrains Mono', monospace" }}>{doneCh}/{PLAN.subjects[subj].length} chapters</div>
                </button>
              );
            })}
          </div>

          <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 16, flexWrap: "wrap" }}>
            {["all", "incomplete", "complete", "flagged"].map(f => (
              <button key={f} className="gt-chip" onClick={() => setFilter(f)}
                style={{ fontSize: 11, fontFamily: "'JetBrains Mono', monospace", padding: "6px 14px", borderRadius: 100, cursor: "pointer",
                  border: filter === f ? "1px solid transparent" : "1px solid rgba(255,255,255,0.12)",
                  background: filter === f ? "#fff" : "rgba(255,255,255,0.04)",
                  color: filter === f ? "#06070a" : "rgba(255,255,255,0.5)",
                  fontWeight: filter === f ? 700 : 500, textTransform: "capitalize" }}>
                {f === "all" ? "All" : f === "incomplete" ? "In progress" : f === "complete" ? "Complete" : "Flagged"}
              </button>
            ))}
            <input type="text" placeholder="Search chapter…" value={search} onChange={e => setSearch(e.target.value)}
              style={{ flex: 1, minWidth: 140, background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.12)", borderRadius: 100, padding: "7px 16px", color: "#fff", fontSize: 12.5, fontFamily: "'Inter', sans-serif" }} />
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))", gap: 12 }}>
            {PLAN.subjects[activeTab].map((c, idx) => {
              if (search && !c.name.toLowerCase().includes(search.toLowerCase())) return null;
              const complete = isChapterComplete(activeTab, c.name);
              const flagged = !!state.flags[chapKey(activeTab, c.name)];
              if (filter === "complete" && !complete) return null;
              if (filter === "incomplete" && complete) return null;
              if (filter === "flagged" && !flagged) return null;
              const progress = chapterProgress(activeTab, c.name);
              const a = ACCENT[SKEY[activeTab]];
              const res = state.resources[chapKey(activeTab, c.name)] || {};

              return (
                <div key={c.name} className="gt-card"
                  style={{ borderRadius: 18, padding: 16, position: "relative",
                    border: flagged ? "1px solid rgba(255,107,107,0.4)" : (complete ? `1px solid ${a.glow}` : "1px solid rgba(255,255,255,0.1)"),
                    background: complete ? `linear-gradient(155deg, ${a.soft}, rgba(255,255,255,0.02))` : "rgba(255,255,255,0.03)",
                    boxShadow: complete ? `0 0 24px -10px ${a.glow}` : "none" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8, marginBottom: 4 }}>
                    <div>
                      <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, color: "rgba(255,255,255,0.35)" }}>CH {String(idx + 1).padStart(2, "0")}</div>
                      <div style={{ fontSize: 13.5, fontWeight: 700, lineHeight: 1.25, fontFamily: "'Space Grotesk', sans-serif" }}>{c.name}</div>
                    </div>
                    <button onClick={() => toggleFlag(activeTab, c.name)}
                      style={{ width: 24, height: 24, borderRadius: 8, flexShrink: 0, cursor: "pointer", fontSize: 12,
                        border: flagged ? "1px solid rgba(255,107,107,0.5)" : "1px solid rgba(255,255,255,0.12)",
                        background: flagged ? "rgba(255,107,107,0.15)" : "transparent",
                        color: flagged ? "#ff9d9d" : "rgba(255,255,255,0.35)" }}
                      title="Flag for revision">⚑</button>
                  </div>
                  <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, color: "rgba(255,255,255,0.4)", marginBottom: 10 }}>
                    {fmtDur(c.totalMin)} · {complete ? "complete" : `${Math.round(progress * 100)}% watched`}
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 5 }}>
                    {RESOURCE_TYPES.map(rt => (
                      <button key={rt.key} className="gt-pip" onClick={() => toggleResource(activeTab, c.name, rt.key)} title={rt.label}
                        style={{ aspectRatio: "1", borderRadius: 8, fontSize: 8.5, fontWeight: 700, fontFamily: "'JetBrains Mono', monospace",
                          border: res[rt.key] ? "1px solid transparent" : "1px solid rgba(255,255,255,0.1)",
                          background: res[rt.key] ? a.c : "rgba(0,0,0,0.2)",
                          color: res[rt.key] ? "#06070a" : "rgba(255,255,255,0.4)", cursor: "pointer" }}>
                        {rt.short}
                      </button>
                    ))}
                  </div>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 10, fontSize: 10, fontFamily: "'JetBrains Mono', monospace", color: "rgba(255,255,255,0.35)" }}>
                    <span>{complete ? "✓ done" : "in progress"}</span>
                    <div style={{ flex: 1, height: 3, background: "rgba(0,0,0,0.3)", borderRadius: 2, margin: "0 8px", overflow: "hidden" }}>
                      <div style={{ height: "100%", width: `${progress * 100}%`, borderRadius: 2, background: a.c }} />
                    </div>
                    <span>{Math.round(progress * 100)}%</span>
                  </div>
                </div>
              );
            })}
          </div>
        </GlassPanel>

        <GlassPanel style={{ padding: 22, marginBottom: 16 }}>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 15, fontWeight: 600, marginBottom: 14 }}>
            Revision Queue {flaggedList.length > 0 && <span style={{ fontSize: 12, color: "rgba(255,255,255,0.35)", fontFamily: "'JetBrains Mono', monospace", fontWeight: 400 }}>· {flaggedList.length}</span>}
          </div>
          {flaggedList.length === 0 ? (
            <div style={{ textAlign: "center", padding: 24, color: "rgba(255,255,255,0.3)", fontSize: 12, fontFamily: "'JetBrains Mono', monospace" }}>
              Flag chapters (⚑) in the wall above to build your revision queue.
            </div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {flaggedList.map((f, i) => {
                const a = ACCENT[SKEY[f.subject]];
                return (
                  <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 14px", background: "rgba(0,0,0,0.2)", border: "1px solid rgba(255,255,255,0.08)", borderRadius: 12, fontSize: 12.5 }}>
                    <div style={{ width: 6, height: 20, borderRadius: 3, background: a.c, flexShrink: 0 }} />
                    <div style={{ flex: 1, fontWeight: 600 }}>{f.chapter}</div>
                    <div style={{ color: "rgba(255,255,255,0.35)", fontSize: 10.5, fontFamily: "'JetBrains Mono', monospace" }}>{f.subject}</div>
                  </div>
                );
              })}
            </div>
          )}
        </GlassPanel>

        <div style={{ textAlign: "center", fontSize: 10.5, color: "rgba(255,255,255,0.25)", fontFamily: "'JetBrains Mono', monospace", marginTop: 20 }}>
          01 SEP 2026 → 31 DEC 2026 · 93 study sessions · {syncMode === "firestore" ? "synced to cloud" : "saved locally"}
        </div>
      </div>
    </div>
  );
}

const styles = {
  root: { position: "relative", minHeight: "100vh", background: "#06070a", overflow: "hidden" },
  mesh: { position: "fixed", inset: 0, zIndex: 0, overflow: "hidden" },
  blob: { position: "absolute", width: "45vw", height: "45vw", minWidth: 400, minHeight: 400, borderRadius: "50%", filter: "blur(120px)", opacity: 0.18, animation: "drift 24s ease-in-out infinite" },
};

function Root() {
  const [firebaseState, setFirebaseState] = useState({ checked: false });
  const [dismissedSetup, setDismissedSetup] = useState(() => {
    try { return localStorage.getItem("grind_tracker_setup_dismissed") === "1"; } catch (e) { return false; }
  });

  useEffect(() => {
    function check() {
      setFirebaseState({ checked: true, configured: window.__firebaseConfigured, ready: window.__firebaseReady });
    }
    if (window.__firebaseReady || window.__firebaseError || window.__firebaseConfigured === false) check();
    else window.addEventListener("firebase-ready", check, { once: true });
  }, []);

  if (!firebaseState.checked) {
    return <div style={styles.root}><div style={{ position: "relative", zIndex: 1, display: "flex", alignItems: "center", justifyContent: "center", height: 400, color: "rgba(255,255,255,0.5)", fontFamily: "Inter, sans-serif" }}>Loading…</div></div>;
  }

  if (!firebaseState.configured && !dismissedSetup) {
    let code = null;
    try {
      code = localStorage.getItem(LS_SYNC_CODE_KEY);
      if (!code) { code = genSyncCode(); localStorage.setItem(LS_SYNC_CODE_KEY, code); }
    } catch (e) {}
    return <SetupWizard syncCode={code} onSkip={() => {
      try { localStorage.setItem("grind_tracker_setup_dismissed", "1"); } catch (e) {}
      setDismissedSetup(true);
    }} />;
  }

  return <GrindTracker />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Root />);

</script>

</body>
</html>
