<!-- One-refresh temporary date override. Set GRIND_TEMP_DATE in sessionStorage, then reload. -->
<script>
(function () {
  var iso = sessionStorage.getItem("GRIND_TEMP_DATE");
  if (!iso) return;
  // Consume it immediately: this page uses the fake date, the next reload is real.
  sessionStorage.removeItem("GRIND_TEMP_DATE");

  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if (!m) return;
  var y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  var RealDate = window.Date;
  var fake = new RealDate(y, mo - 1, d, 12, 0, 0, 0).getTime();

  function FakeDate() {
    var args = Array.prototype.slice.call(arguments);
    if (!(this instanceof FakeDate)) return new RealDate(fake).toString();
    if (args.length === 0) return new RealDate(fake);
    return new (Function.prototype.bind.apply(RealDate, [null].concat(args)))();
  }
  FakeDate.prototype = RealDate.prototype;
  Object.setPrototypeOf(FakeDate, RealDate);
  FakeDate.now = function () { return fake; };
  FakeDate.parse = RealDate.parse.bind(RealDate);
  FakeDate.UTC = RealDate.UTC.bind(RealDate);
  window.Date = FakeDate;
  window.__GRIND_FAKE_TODAY__ = iso;
})();
</script>

function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function parseISO(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
}

// Keep date-only values in local calendar time. Using toISOString() here would
// convert local midnight to UTC and can display the previous calendar day.
function localISODate(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function fmtDate(iso, opts) {
  return parseISO(iso).toLocaleDateString("en-US", opts || { day: "2-digit", month: "short" });
}
function fmtDur(mins) {
  const s = Math.round(mins * 60);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  if (h > 0) return `${h}h ${String(m).padStart(2, "0")}m`;
  return `${m}m`;
}
function fmtClock(mins) {
  const s = Math.round(mins * 60);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
  return `${m}:${String(sec).padStart(2, "0")}`;
}
function chapKey(subj, ch) { return subj + "::" + ch; }

function genSyncCode() {
  const words = ["orbit", "cedar", "flux", "quartz", "ember", "delta", "coral", "lumen", "nova", "vapor", "birch", "prism"];
  const w = words[Math.floor(Math.random() * words.length)];
  const n = Math.floor(1000 + Math.random() * 9000);
  return `${w}-${n}`;
}

// ============================================================
// STORAGE: Firestore when configured, localStorage fallback otherwise
// ============================================================
function useProgressStore() {
  const [state, setState] = useState({ doneDays: {}, resources: {}, ready: false });
  const [syncMode, setSyncMode] = useState("checking"); // checking | firestore | local
  const [syncCode, setSyncCode] = useState(null);
  const [syncStatus, setSyncStatus] = useState("idle"); // idle | saving | saved | error
  const unsubRef = useRef(null);
  const skipNextSnapshot = useRef(false);

  const loadLocal = useCallback(() => {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { doneDays: {}, resources: {} };
  }, []);

  const saveLocal = useCallback((data) => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch (e) {}
  }, []);

  // init: decide firestore vs local
  useEffect(() => {
    function boot() {
      const configured = window.__firebaseConfigured && window.__firebaseReady;
      if (!configured) {
        const local = loadLocal();
        setState(s => ({ ...s, ...local, ready: true }));
        setSyncMode("local");
        return;
      }
      setSyncMode("firestore");
      let code = localStorage.getItem(LS_SYNC_CODE_KEY);
      if (!code) {
        code = genSyncCode();
        localStorage.setItem(LS_SYNC_CODE_KEY, code);
      }
      setSyncCode(code);
    }
    if (window.__firebaseReady || window.__firebaseError || window.__firebaseConfigured === false) {
      boot();
    } else {
      window.addEventListener("firebase-ready", boot, { once: true });
    }
  }, [loadLocal]);

  // subscribe to firestore doc once we have a sync code
  useEffect(() => {
    if (syncMode !== "firestore" || !syncCode) return;
    const { __db, __fsDoc, __fsOnSnapshot, __fsGetDoc } = window;
    const ref = __fsDoc(__db, "grind_progress", syncCode);

    __fsGetDoc(ref).then(snap => {
      if (snap.exists) {
        const data = snap.data();
        setState(s => ({ ...s, doneDays: data.doneDays || {}, resources: data.resources || {}, ready: true }));
      } else {
        setState(s => ({ ...s, ready: true }));
      }

      const unsub = __fsOnSnapshot(ref, (snap2) => {
        if (skipNextSnapshot.current) { skipNextSnapshot.current = false; return; }
        if (snap2.exists) {
          const data = snap2.data();
          setState(s => ({ ...s, doneDays: data.doneDays || {}, resources: data.resources || {}, ready: true }));
        }
      }, (err) => {
        console.error("Firestore listen error:", err);
        setSyncStatus("error");
      });
      unsubRef.current = unsub;
    }).catch(err => {
      console.error("Firestore get error:", err);
      setSyncStatus("error");
      const local = loadLocal();
      setState(s => ({ ...s, ...local, ready: true }));
    });

    return () => { if (unsubRef.current) unsubRef.current(); };
  }, [syncMode, syncCode, loadLocal]);

  const persist = useCallback((next) => {
    const { ready, ...payload } = next;
    if (syncMode === "firestore" && syncCode && window.__firebaseReady) {
      setSyncStatus("saving");
      skipNextSnapshot.current = true;
      const { __db, __fsDoc, __fsSetDoc } = window;
      const ref = __fsDoc(__db, "grind_progress", syncCode);
      __fsSetDoc(ref, payload).then(() => setSyncStatus("saved")).catch(err => {
        console.error("Firestore save error:", err);
        setSyncStatus("error");
      });
    } else {
      saveLocal(payload);
    }
  }, [syncMode, syncCode, saveLocal]);

  const markDone = useCallback((date, val) => {
    setState(s => {
      const next = { ...s, doneDays: { ...s.doneDays, [date]: val } };
      persist(next);
      return next;
    });
  }, [persist]);

  const toggleResource = useCallback((subject, chapter, resKey) => {
    setState(s => {
      const k = chapKey(subject, chapter);
      const cur = s.resources[k] || {};
      const next = { ...s, resources: { ...s.resources, [k]: { ...cur, [resKey]: !cur[resKey] } } };
      persist(next);
      return next;
    });
  }, [persist]);


  const resetProgress = useCallback(() => {
    const empty = { doneDays: {}, resources: {}, ready: true };
    setState(empty);
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
    persist(empty);
  }, [persist]);

  const switchSyncCode = useCallback((newCode) => {
    localStorage.setItem(LS_SYNC_CODE_KEY, newCode);
    setState(s => ({ ...s, ready: false }));
    setSyncCode(newCode);
  }, []);

  return { state, markDone, toggleResource, resetProgress, syncMode, syncCode, syncStatus, switchSyncCode };
}

function GrindTracker() {
  const { state, markDone, toggleResource, resetProgress, syncMode, syncCode, syncStatus, switchSyncCode } = useProgressStore();
  const [activeTab, setActiveTab] = useState("Physics");
  const [filter, setFilter] = useState("all");
  const [search, setSearch] = useState("");
  const [showSyncPanel, setShowSyncPanel] = useState(false);
  const [codeInput, setCodeInput] = useState("");
  const [syncCopied, setSyncCopied] = useState(false);
  const [resetConfirm, setResetConfirm] = useState("");
  const [showReset, setShowReset] = useState(false);
  const [selectedDate, setSelectedDate] = useState(() => {
    const todayEntry = PLAN.calendar.find(e => e.date === TODAY);
    return todayEntry ? todayEntry.date : PLAN.calendar[0].date;
  });
  const studyDays = useMemo(() => PLAN.calendar.filter(e => e.type === "study"), []);
  const chapterSessions = useMemo(() => {
    const m = {};
    studyDays.forEach(e => {
      const k = chapKey(e.subject, e.chapter);
      if (!m[k]) m[k] = [];
      m[k].push(e);
    });
    return m;
  }, [studyDays]);

  const isChapterComplete = useCallback((subj, ch) => {
    const sessions = chapterSessions[chapKey(subj, ch)] || [];
    return sessions.length > 0 && sessions.every(s => state.doneDays[s.date]);
  }, [chapterSessions, state.doneDays]);

  const chapterProgress = useCallback((subj, ch) => {
    const sessions = chapterSessions[chapKey(subj, ch)] || [];
    if (sessions.length === 0) return 0;
    return sessions.filter(s => state.doneDays[s.date]).length / sessions.length;
  }, [chapterSessions, state.doneDays]);

  const chapterMinDone = useCallback((subj, ch) => {
    const sessions = chapterSessions[chapKey(subj, ch)] || [];
    return sessions.reduce((a, s) => a + (state.doneDays[s.date] ? s.duration : 0), 0);
  }, [chapterSessions, state.doneDays]);

  const subjectTotalMin = useCallback((subj) => PLAN.subjects[subj].reduce((a, c) => a + c.totalMin, 0), []);
  const subjectDoneMin = useCallback((subj) => PLAN.subjects[subj].reduce((a, c) => a + chapterMinDone(subj, c.name), 0), [chapterMinDone]);
  const subjectPct = useCallback((subj) => {
    const t = subjectTotalMin(subj);
    return t > 0 ? subjectDoneMin(subj) / t : 0;
  }, [subjectTotalMin, subjectDoneMin]);

  const isMissed = useCallback((e) => e.type === "study" && e.date < TODAY && !state.doneDays[e.date], [state.doneDays]);
  const missedDays = useMemo(() => studyDays.filter(isMissed), [studyDays, isMissed]);

  const focusEntry = useMemo(() => {
    if (missedDays.length > 0) return missedDays[0];
    const today = PLAN.calendar.find(e => e.date === TODAY);
    if (today && today.type === "study") return today;
    return studyDays.find(e => e.date >= TODAY) || studyDays[studyDays.length - 1];
  }, [missedDays, studyDays]);

  const selectedEntry = useMemo(() => PLAN.calendar.find(e => e.date === selectedDate) || null, [selectedDate]);
  const displayEntry = selectedEntry || focusEntry;
  const selectedIndex = useMemo(() => PLAN.calendar.findIndex(e => e.date === selectedDate), [selectedDate]);

  // Keyboard navigation: T = today, ← = previous day, → = next day.
  // Ignore shortcuts while the user is typing in an input/textarea/select.
  useEffect(() => {
    const onKeyDown = (event) => {
      const target = event.target;
      const tag = target && target.tagName ? target.tagName.toLowerCase() : "";
      if (tag === "input" || tag === "textarea" || tag === "select" || (target && target.isContentEditable)) return;

      if (event.key === "t" || event.key === "T") {
        const todayEntry = PLAN.calendar.find(e => e.date === TODAY);
        if (todayEntry) {
          event.preventDefault();
          setSelectedDate(todayEntry.date);
        }
        return;
      }

      if (event.key === "ArrowLeft" && selectedIndex > 0) {
        event.preventDefault();
        setSelectedDate(PLAN.calendar[selectedIndex - 1].date);
        return;
      }

      if (event.key === "ArrowRight" && selectedIndex >= 0 && selectedIndex < PLAN.calendar.length - 1) {
        event.preventDefault();
        setSelectedDate(PLAN.calendar[selectedIndex + 1].date);
      }
    };

    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, [selectedIndex]);

  const streak = useMemo(() => {
    // Use the latest completed session as the anchor so progress updates immediately
    // even when the user marks a future or past date from the navigator.
    const completedIndexes = studyDays.map((e, i) => state.doneDays[e.date] ? i : -1).filter(i => i >= 0);
    if (completedIndexes.length === 0) return { current: 0, longest: 0 };
    const anchor = Math.max(...completedIndexes);
    let current = 0;
    for (let i = anchor; i >= 0 && state.doneDays[studyDays[i].date]; i--) current++;
    let longest = 0, run = 0;
    studyDays.forEach(e => {
      if (state.doneDays[e.date]) { run++; longest = Math.max(longest, run); }
      else run = 0;
    });
    return { current, longest };
  }, [studyDays, state.doneDays]);


  const expectedPct = useCallback((subj) => {
    const sessions = studyDays.filter(e => e.subject === subj);
    if (sessions.length === 0) return 0;
    return sessions.filter(e => e.date <= TODAY).length / sessions.length;
  }, [studyDays]);

  const projectFinish = useCallback((subj) => {
    const sessions = studyDays.filter(e => e.subject === subj);
    const last = sessions[sessions.length - 1];
    // Intentionally session-based: every session completed ahead of its planned date
    // moves the finish by exactly one day earlier; every overdue uncompleted session
    // adds exactly one day. This prevents one checkbox from causing huge jumps.
    const ahead = sessions.filter(e => e.date > TODAY && state.doneDays[e.date]).length;
    const missed = sessions.filter(e => e.date < TODAY && !state.doneDays[e.date]).length;
    const delta = missed - ahead;
    const projDate = new Date(parseISO(last.date).getTime() + delta * 86400000);
    let status = "exact";
    if (delta < 0) status = "early";
    else if (delta > 0) status = "late";
    return { date: localISODate(projDate), delta, status };
  }, [studyDays, state.doneDays]);

  const daysLeft = useMemo(() => {
    // Inclusive count from the real current day through the plan end date.
    // On 31 Aug 2026 this correctly includes 31 Aug itself plus every day
    // through 31 Dec, giving one more day than the Sep 1 → Dec 31 count.
    const end = parseISO(PLAN.endDate);
    const today = parseISO(TODAY);
    return today > end ? 0 : Math.floor((end - today) / 86400000) + 1;
  }, []);

  const overallPct = useMemo(() => {
    const t = SUBJECTS.reduce((a, s) => a + subjectTotalMin(s), 0);
    const d = SUBJECTS.reduce((a, s) => a + subjectDoneMin(s), 0);
    return t > 0 ? Math.round((d / t) * 100) : 0;
  }, [subjectTotalMin, subjectDoneMin]);


  const focusAccent = displayEntry && displayEntry.type === "study" ? ACCENT[SKEY[displayEntry.subject]] : ACCENT.phy;

  return (

        @keyframes splashIn { 0% { opacity: 0; transform: translateY(14px) scale(.96); filter: blur(8px); } 55% { opacity: 1; filter: blur(0); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
        @keyframes splashBar { 0% { transform: translateX(-110%); } 100% { transform: translateX(220%); } }
        @keyframes splashGlow { 0%,100% { transform: scale(1); opacity: .45; } 50% { transform: scale(1.12); opacity: .8; } }
        .grind-splash { position: fixed; inset: 0; overflow: hidden; background: #06070a; color: #f4f5f7; display: grid; place-items: center; isolation: isolate; }
        .grind-splash::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(circle at 50% 42%, rgba(100,217,234,.11), transparent 26%), linear-gradient(180deg, rgba(255,255,255,.025), transparent 42%); }
        .grind-splash-content { width: min(280px, 72vw); text-align: center; animation: splashIn .8s cubic-bezier(.16,1,.3,1) both; }

          </div>

        <div style={{ textAlign: "center", fontSize: 10.5, color: "rgba(255,255,255,0.25)", fontFamily: "'JetBrains Mono', monospace", marginTop: 20 }}>
          01 SEP 2026 → 31 DEC 2026 · 93 study sessions · {syncMode === "firestore" ? "synced to cloud" : "saved locally"}
        </div>
      </div>
    </div>
  );
}

const styles = {
  root: { position: "relative", minHeight: "100vh", background: "#06070a", overflow: "hidden" },
  mesh: { position: "fixed", inset: 0, zIndex: 0, overflow: "hidden" },
  blob: { position: "absolute", width: "45vw", height: "45vw", minWidth: 400, minHeight: 400, borderRadius: "50%", filter: "blur(120px)", opacity: 0.18, animation: "drift 24s ease-in-out infinite" },
};

function Root() {
  const [firebaseState, setFirebaseState] = useState({ checked: false });
  const [dismissedSetup, setDismissedSetup] = useState(() => {
    try { return localStorage.getItem("grind_tracker_setup_dismissed") === "1"; } catch (e) { return false; }
  });
  const [entranceDone, setEntranceDone] = useState(false);

  useEffect(() => {
    const timer = setTimeout(() => setEntranceDone(true), 1000);
    return () => clearTimeout(timer);
  }, []);

  useEffect(() => {
    function check() {
      setFirebaseState({ checked: true, configured: window.__firebaseConfigured, ready: window.__firebaseReady });
    }
    if (window.__firebaseReady || window.__firebaseError || window.__firebaseConfigured === false) check();
    else window.addEventListener("firebase-ready", check, { once: true });
  }, []);

  // Keep the single opening entrance on screen until the bootstrap check finishes.
  // This prevents a second "syncing/loading" screen from flashing after it.
  if (!entranceDone || !firebaseState.checked) {
    return (
      <div className="grind-splash">
        <div className="grind-splash-orb grind-splash-orb-a" />
        <div className="grind-splash-orb grind-splash-orb-b" />
        <div className="grind-splash-content">
          <div className="grind-splash-brand">GRIND<span className="grind-splash-brand-dot">.</span></div>
          <div className="grind-splash-subjects">PHYSICS&nbsp;&nbsp;·&nbsp;&nbsp;CHEMISTRY&nbsp;&nbsp;·&nbsp;&nbsp;MATHS</div>
          <div className="grind-splash-line"><span /></div>
          <div className="grind-splash-status">LOADING TODAY'S PLAN</div>
        </div>
      </div>
    );
  }

  if (!firebaseState.configured && !dismissedSetup) {
    let code = null;
    try {
      code = localStorage.getItem(LS_SYNC_CODE_KEY);
      if (!code) { code = genSyncCode(); localStorage.setItem(LS_SYNC_CODE_KEY, code); }
    } catch (e) {}
    return <SetupWizard syncCode={code} onSkip={() => {
      try { localStorage.setItem("grind_tracker_setup_dismissed", "1"); } catch (e) {}
      setDismissedSetup(true);
    }} />;
  }

  return <GrindTracker />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Root />);

</script>

<!-- Compile the JSX manually. The Firebase SDK above uses classic compat scripts,
     so no ES-module import statement can leak into this compiled app. -->
<script>
(function () {
  function startApp() {
    try {
      const source = document.getElementById("grind-app-source").textContent;
      if (!window.Babel) throw new Error("Babel failed to load");
      const compiled = Babel.transform(source, {
        presets: [["react", { runtime: "classic" }]],
        sourceType: "script",
        filename: "grind-app.jsx"
      }).code;
      // Execute the compiled app directly instead of dynamically appending a
      // <script> element. Some browsers/DevTools contexts reject dynamically
      // appended inline scripts, which was causing the blank page.
      new Function(compiled)();
    } catch (err) {
      console.error("GRIND app startup failed:", err);
      const root = document.getElementById("root");
      if (root) {
        root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#ff8b8b;font-family:Arial,sans-serif;background:#06070a;text-align:center"><div><b>GRIND could not start.</b><br><span style="color:#bbb;font-size:13px">Open DevTools Console for the exact error.</span></div></div>';
      }
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startApp, { once: true });
  } else {
    startApp();
  }
})();
</script>

</body>
</html>
